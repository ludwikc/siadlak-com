    <!-- Google Consent Mode v2 — defaults DENIED. MUST run before any Google tag. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',

      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
      gtag('js', new Date());
    </script>

    <!-- CookieYes CMP — updates Consent Mode on the visitor's choice -->
    <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/7a00710ab4d1d167ad01acea/script.js"></script>

    <!-- CookieYes -> dataLayer bridge: exposes consent categories to GTM (for non-Google tags) -->
    <script>
      (function () {
        function pushConsent(detail) {
          var accepted = (detail && detail.accepted) || [];
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'cky_consent_update',
            cky_accepted: accepted,
            cky_analytics: accepted.indexOf('analytics') > -1,
            cky_advertisement: accepted.indexOf('advertisement') > -1
          });
        }
        document.addEventListener('cookieyes_consent_update', function (e) { pushConsent(e.detail); });
        // Returning visitor: replay stored consent from the cookie on load.
        var m = document.cookie.match(/cookieyes-consent=([^;]+)/);
        if (m && /action:yes/.test(m[1])) {
          var accepted = [];
          ['necessary','functional','analytics','performance','advertisement'].forEach(function (c) {
            if (new RegExp(c + ':yes').test(m[1])) accepted.push(c);
          });
          pushConsent({ accepted: accepted });
        }
      })();
    </script>
